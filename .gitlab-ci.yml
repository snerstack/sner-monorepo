image: docker:git

stages:
  - build-server
  - build-agent

# sysbox build notes for cesnet gitlab runner instance
# currently not used because sysbox deployment lacks docker build cache
# pipeline-name:
#   image: nestybox/ubuntu-jammy-docker
#   stage: stage-name
#   tags: [sysbox-dind]
#   before_script:
#     - apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -q -y docker-compose-plugin

build-server:
  stage: build-server
  tags: [sner-build-docker]

  script:
    - cd docker
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker compose -f docker-compose.yaml -f docker-compose.ci.yaml build --pull -- server
    - docker compose -f docker-compose.yaml -f docker-compose.ci.yaml push -- server
    - docker logout $CI_REGISTRY

build-agent:
  stage: build-agent
  tags: [sner-build-docker]

  script:
    - cd docker
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker compose -f docker-compose.yaml -f docker-compose.ci.yaml build --pull -- agent
    - docker compose -f docker-compose.yaml -f docker-compose.ci.yaml push -- agent
    - docker logout $CI_REGISTRY
